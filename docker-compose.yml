services:
  db_rpg:
    image: postgres:15-alpine
    container_name: db_castle_rpg
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rpg_network

  backend_core_rpg:
    build: ./backend_core
    container_name: django_castle_rpg
    volumes:
      - ./backend_core:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db_rpg
    depends_on:
      - db_rpg
    ports:
      - "8000:8000"
    networks:
      - rpg_network

  
  frontend_spa_rpg:
    build: ./frontend_spa
    container_name: react_castle_rpg
    volumes:
      - ./frontend_spa:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    networks:
      - rpg_network

networks:
  rpg_network:
    driver: bridge

volumes:
  postgres_data: